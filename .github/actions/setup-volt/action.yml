name: Set up Volt
description: >-
  Node from .nvmrc and the root node_modules. The cache is the one the release Compile job
  (volt-build.yml) saves, keyed by every package-lock.json, so a PR that does not change
  dependencies extracts it in about a minute instead of running npm ci.

inputs:
  github-token:
    description: Token for the GitHub downloads npm postinstall makes (avoids anonymous rate limits)
    required: true

outputs:
  cache-hit:
    description: Whether node_modules came from the cache
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - name: Prepare node_modules cache key
      shell: bash
      run: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.js compile "$(node -p process.arch)" > .build/packagelockhash

    - name: Restore node_modules cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: .build/node_modules_cache
        key: volt-node_modules-compile-${{ hashFiles('.build/packagelockhash') }}

    - name: Extract node_modules cache
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: tar -xzf .build/node_modules_cache/cache.tgz

    - name: Install system dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -e
        ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
        ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev libsecret-1-dev libgbm1

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -e
        for i in {1..5}; do
          npm ci && break
          if [ "$i" -eq 5 ]; then echo "npm ci failed too many times" >&2; exit 1; fi
          echo "npm ci failed $i, retrying..."
        done
      env:
        npm_config_arch: x64
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Pack node_modules cache
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -e
        node build/azure-pipelines/common/listNodeModules.js .build/node_modules_list.txt
        mkdir -p .build/node_modules_cache
        tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

    - name: Save node_modules cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .build/node_modules_cache
        key: volt-node_modules-compile-${{ hashFiles('.build/packagelockhash') }}
