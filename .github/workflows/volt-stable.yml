name: Volt Stable

on:
  push:
    tags:
      - 'v*'
      - '!v*-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.0.1 (empty = package.json version)'
        default: ''
      platforms:
        description: 'Targets (comma-separated) or "all"'
        default: all
      publish:
        description: Publish the release and update the feed
        type: boolean
        default: true

concurrency:
  group: volt-release-stable-${{ github.ref }}

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/volt-build.yml
    secrets: inherit
    with:
      channel: stable
      version: ${{ inputs.version || '' }}
      platforms: ${{ inputs.platforms || 'all' }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}

  # Nightly must never trail Stable: rebuild it from the default branch once a Stable release is out.
  # A workflow_dispatch sent with GITHUB_TOKEN is one of the few events that starts another workflow.
  nightly:
    name: Rebuild Nightly
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run volt-nightly.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"
