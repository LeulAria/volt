name: Volt npm

# Publishes volt-run (apps/volt-run, `npx volt-run`) for a Volt release: the package takes the
# release's version and carries its assets' SHA-256s (apps/volt-run/scripts/release.mjs).
# volt-stable.yml calls it once a stable release is out; run it by hand for a beta or nightly, or to
# publish again. Publishing needs the NPM_TOKEN secret (an npm automation token that may publish
# volt-run); without it the package is still built, tested and packed, and the run says so.

on:
  workflow_call:
    inputs:
      version:
        description: Volt version (empty = the pushed tag, else package.json)
        type: string
        default: ''
      channel:
        type: string
        default: stable
      publish:
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Volt version whose GitHub release volt-run downloads, e.g. 0.0.6 (empty = package.json version)'
        default: ''
      channel:
        description: Channel
        type: choice
        options: [stable, beta, nightly]
        default: stable
      publish:
        description: Publish to npm (off = build, test and pack only)
        type: boolean
        default: true

permissions:
  contents: read
  # npm provenance: the package says which workflow run built it.
  id-token: write

jobs:
  publish:
    name: Publish volt-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            apps/volt-run
            build/volt
            src/vs/platform/voltAgentServer/node
            src/vs/workbench/contrib/voltSettings/browser/vendor

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --prefix apps/volt-run

      - name: Build, test, pack and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -z "$VERSION" ] && [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VERSION" ]; then VERSION="$(node -p "require('./package.json').version")"; fi
          ARGS=(--version "$VERSION" --channel "$CHANNEL")
          if [ "$PUBLISH" = true ]; then
            if [ -n "$NODE_AUTH_TOKEN" ]; then
              ARGS+=(--publish)
            else
              echo "::warning::NPM_TOKEN is not set: volt-run $VERSION was built and tested but not published. Add an npm automation token with: gh secret set NPM_TOKEN"
            fi
          fi
          node apps/volt-run/scripts/release.mjs "${ARGS[@]}"
