name: AI Review

# A free AI code review on every pull request: a summary comment (what changed, a walkthrough of the
# files, findings by severity) and inline comments on the lines with real problems, like CodeRabbit.
# build/volt/ci/review/review.mjs does the work; .github/review-guidelines.md holds Volt's rules.
#
# Setup (free): create a Gemini API key at https://aistudio.google.com/apikey and add it as the
# repository secret GEMINI_API_KEY. Or use OPENROUTER_API_KEY, or any OpenAI-compatible endpoint with
# the secret AI_REVIEW_API_KEY and the variable AI_REVIEW_BASE_URL. The variable AI_REVIEW_MODEL picks
# the models (comma-separated, tried in order). Without a key the job only prints how to set it up.
#
# Runs on new pull requests and every push (new commits only), not on drafts or bot PRs. A
# maintainer can comment `/review` (new commits) or `/review full` at any time; the
# skip-ai-review label turns it off for one PR.
#
# Security: pull_request_target runs this file as it is on main, with the key. It never checks out
# or runs the PR's code; the diff is read through the API and the model has no tools.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] reads the diff through the API only, never checks out or runs the PR
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      full:
        description: Review the whole pull request, not only the commits since the last review
        type: boolean
        default: false

permissions: {}

# One review at a time per PR. A push during a review waits for it, then reviews only what is new.
concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  review:
    name: Review
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review ')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The default branch, never the PR head: the review script and its rules are the trusted copy.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            build/volt/ci
            .github
            .claude/skills
            .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          PR_NUMBER: ${{ inputs.pr }}
          REVIEW_FULL: ${{ inputs.full }}
        run: node build/volt/ci/review/review.mjs
