name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please [search existing issues](https://github.com/LeulAria/volt/issues) first, and describe the problem before the solution.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem. What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Volt to do?
      description: Describe how it could work. Sketches and examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
